# Local development only. Production deploys backend/worker/frontend
# separately (Railway + Vercel) per the Phase 1 design doc — this file
# exists so the whole stack runs with one command on a dev machine.
#
# Scope per Task 1: backend + frontend + postgres only. Redis and the
# worker service are still not added — they arrive with the parsing/
# embedding task, per "introduce new tech only when needed." Task 3B
# added local-disk document storage (no new service — just a volume
# on the existing backend container, below).

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: researchpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/researchpilot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      # Named volume for uploaded files (Task 3B Checkpoint 4), nested
      # under the bind mount above at UPLOAD_DIR's container path
      # (default storage/uploads -> /app/storage/uploads, since the
      # Dockerfile's WORKDIR is /app). Docker resolves the more
      # specific mount for that subpath, so uploads persist in a real
      # volume (survives container recreation, isn't dumped into the
      # host's git-tracked backend/ folder) while the rest of the app
      # code still hot-reloads via the bind mount.
      - uploads_data:/app/storage/uploads

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:4173"
    depends_on:
      - backend

volumes:
  postgres_data:
  uploads_data:
