# Local development only. Production deploys the backend, frontend,
# and database separately (Render + Vercel + Neon), per the approved
# $0-cost deployment architecture — this file exists so the whole
# stack runs with one command on a dev machine.
#
# No background worker or Redis in this stack — see docs/ARCHITECTURE.md.
# Uploaded-document storage is Cloudflare R2 (not a local volume) as
# of the R2 storage migration — real R2 credentials in backend/.env
# are required for upload/process to actually work locally; automated
# tests never need them (see backend/tests/conftest.py's fake R2
# fixture).

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: researchpilot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/researchpilot
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    ports:
      - "5173:4173"
    depends_on:
      - backend

volumes:
  postgres_data:
